services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: find_ai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - notion_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d find_ai"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  notion_db:
